<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Story Creator — @verodepasymas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #1B2A4A; --gold: #D4AF37; --cream: #F5EDE0;
      --white: #FFFFFF; --text: #1A1A1A; --muted: #888;
      --border: #E4D9CC; --radius: 14px;
    }
    body { font-family: 'Poppins', sans-serif; background: var(--cream); color: var(--text); min-height: 100dvh; -webkit-tap-highlight-color: transparent; }

    .header { background: var(--navy); color: var(--white); padding: 14px 20px; text-align: center; position: sticky; top: 0; z-index: 200; box-shadow: 0 2px 16px rgba(0,0,0,.25); }
    .header h1 { font-family: 'Playfair Display', serif; font-size: 19px; letter-spacing: .4px; }
    .header p  { font-size: 10px; color: var(--gold); letter-spacing: 1.5px; text-transform: uppercase; margin-top: 2px; }

    .page { max-width: 480px; margin: 0 auto; padding: 14px 14px 40px; }

    .card { background: var(--white); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; box-shadow: 0 1px 10px rgba(0,0,0,.07); }
    .card-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--navy); margin-bottom: 14px; padding-bottom: 10px; border-bottom: 2px solid var(--cream); }

    /* Preview */
    .preview-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    #previewCanvas { border-radius: 10px; box-shadow: 0 6px 24px rgba(0,0,0,.18); display: block; width: 168px; height: 298px; background: var(--navy); }
    .tpl-row { display: flex; gap: 8px; width: 100%; }
    .tpl-btn { flex: 1; padding: 9px 4px; border: 2px solid var(--border); border-radius: 10px; background: var(--white); font-family: 'Poppins', sans-serif; font-size: 11px; font-weight: 500; color: var(--muted); cursor: pointer; transition: all .18s; text-align: center; }
    .tpl-btn.active { border-color: var(--gold); background: #FFFBF0; color: var(--navy); font-weight: 700; }

    /* Photo upload */
    .upload-zone { border: 2px dashed var(--gold); border-radius: 12px; padding: 22px 12px; text-align: center; background: #FFFBF0; cursor: pointer; transition: background .15s; }
    .upload-zone.small { padding: 14px 12px; }
    .upload-zone:active { background: #FFF5D6; }
    .upload-icon { font-size: 32px; }
    .upload-zone strong { display: block; font-size: 14px; color: var(--navy); margin: 6px 0 3px; }
    .upload-zone span { font-size: 12px; color: var(--muted); }
    #photoInput { display: none; }

    .thumb-strip { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 4px; scrollbar-width: none; }
    .thumb-strip::-webkit-scrollbar { display: none; }
    .thumb-item { position: relative; flex-shrink: 0; }
    .thumb-item img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; display: block; border: 2px solid transparent; }
    .thumb-item img.active-thumb { border-color: var(--gold); }
    .thumb-remove { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%; background: #E53935; color: white; border: none; font-size: 11px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: 700; }

    .mode-row { display: flex; gap: 8px; margin-top: 12px; }
    .mode-btn { flex: 1; padding: 10px 8px; border: 2px solid var(--border); border-radius: 10px; background: var(--white); font-family: 'Poppins', sans-serif; font-size: 12px; font-weight: 500; color: var(--muted); cursor: pointer; transition: all .18s; text-align: center; }
    .mode-btn.active { border-color: var(--navy); background: var(--navy); color: var(--white); font-weight: 600; }
    .mode-hint { font-size: 11px; color: var(--muted); margin-top: 8px; text-align: center; line-height: 1.4; }


    /* Radio/checkbox pills */
    .pill-group { display: flex; gap: 8px; }
    .pill-option { flex: 1; position: relative; }
    .pill-option input { position: absolute; opacity: 0; width: 0; }
    .pill-option label { display: block; text-align: center; padding: 10px 8px; border: 2px solid var(--border); border-radius: 10px; font-size: 13px; font-weight: 500; color: #666; cursor: pointer; transition: all .18s; }
    .pill-option input:checked + label { border-color: var(--navy); background: var(--navy); color: var(--white); font-weight: 600; }

    /* Form fields */
    .field { margin-bottom: 12px; }
    .field:last-child { margin-bottom: 0; }
    label.lbl { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: #666; margin-bottom: 6px; }
    .inp { width: 100%; border: 1.5px solid var(--border); border-radius: 10px; padding: 11px 13px; font-family: 'Poppins', sans-serif; font-size: 14px; color: var(--text); background: var(--white); -webkit-appearance: none; transition: border-color .18s; }
    .inp:focus { outline: none; border-color: var(--gold); }
    select.inp { cursor: pointer; }
    textarea.inp { resize: none; height: 78px; }
    .price-row { display: flex; gap: 8px; }
    .currency { width: 68px; flex-shrink: 0; border: 1.5px solid var(--border); border-radius: 10px; padding: 11px 6px; font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 600; text-align: center; background: var(--white); -webkit-appearance: none; color: var(--navy); }
    .currency:focus { outline: none; border-color: var(--gold); }

    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .stat-box { text-align: center; }
    .stat-box .lbl { text-align: center; }
    .stat-inp { width: 100%; border: 1.5px solid var(--border); border-radius: 10px; padding: 10px 4px; font-family: 'Poppins', sans-serif; font-size: 18px; font-weight: 700; color: var(--navy); text-align: center; background: var(--white); -webkit-appearance: none; }
    .stat-inp:focus { outline: none; border-color: var(--gold); }

    .checks-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
    .chk-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1.5px solid var(--border); border-radius: 8px; cursor: pointer; transition: all .15s; }
    .chk-item input { width: 16px; height: 16px; accent-color: var(--navy); cursor: pointer; }
    .chk-item label { font-size: 12px; color: #555; cursor: pointer; line-height: 1.2; }
    .chk-item:has(input:checked) { border-color: var(--navy); background: #EEF2FF; }

    .dl-btn { width: 100%; background: linear-gradient(135deg, var(--gold), #E8C967); color: var(--navy); border: none; border-radius: 14px; padding: 18px; font-family: 'Poppins', sans-serif; font-size: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 4px 18px rgba(212,175,55,.35); transition: all .18s; margin-bottom: 12px; }
    .dl-btn:active { transform: scale(.97); }

    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--navy); color: var(--white); padding: 12px 22px; border-radius: 100px; font-size: 13px; font-weight: 500; z-index: 999; transition: transform .28s ease; white-space: nowrap; pointer-events: none; }
    .toast.show { transform: translateX(-50%) translateY(0); }
    #mainCanvas { display: none; }
  </style>
</head>
<body>

<header class="header">
  <h1>Story Creator 🏠</h1>
  <p>Orietta Sotomayor · @verodepasymas</p>
</header>

<div class="page">

  <!-- PREVIEW -->
  <div class="card">
    <div class="card-title">Vista previa</div>
    <div class="preview-wrap">
      <canvas id="previewCanvas"></canvas>
      <div class="tpl-row" id="tplRow">
        <button class="tpl-btn active" onclick="setTpl(1)">🏠 Clásico</button>
        <button class="tpl-btn"        onclick="setTpl(2)">📋 Editorial</button>
        <button class="tpl-btn"        onclick="setTpl(3)">⚡ Impacto</button>
      </div>
    </div>
  </div>

  <!-- FOTO -->
  <div class="card">
    <div class="card-title">📸 Fotos de la propiedad</div>
    <div class="upload-zone" onclick="document.getElementById('photoInput').click()">
      <div class="upload-icon">🏠</div>
      <strong>Toca para agregar fotos</strong>
      <span>Puedes seleccionar varias a la vez · JPG · PNG · HEIC</span>
    </div>
    <input type="file" id="photoInput" accept="image/*" multiple onchange="onPhoto(event)">
    <div class="thumb-strip" id="thumbStrip" style="display:none"></div>
    <div id="multiModeRow" style="display:none">
      <div class="mode-row">
        <button class="mode-btn active" id="btnSlides"  onclick="setMode('slides')">📑 Un slide por foto</button>
        <button class="mode-btn"        id="btnCollage" onclick="setMode('collage')">⊞ Collage</button>
      </div>
      <p class="mode-hint" id="modeHint"></p>
    </div>
  </div>

  <!-- OPERACIÓN -->
  <div class="card">
    <div class="card-title">🏷️ Operación y tipo</div>
    <div class="field">
      <div class="pill-group">
        <div class="pill-option">
          <input type="checkbox" id="opVenta" checked onchange="debouncedPreview()">
          <label for="opVenta">🤝 Venta</label>
        </div>
        <div class="pill-option">
          <input type="checkbox" id="opAlq" onchange="debouncedPreview()">
          <label for="opAlq">🔑 Alquiler</label>
        </div>
      </div>
    </div>
    <div class="field">
      <label class="lbl" for="tipoProp">Tipo de propiedad</label>
      <select class="inp" id="tipoProp" onchange="debouncedPreview()">
        <option value="Departamento">Departamento</option>
        <option value="Casa">Casa</option>
        <option value="Casa de playa">Casa de playa</option>
        <option value="Penthouse">Penthouse</option>
        <option value="Duplex">Dúplex</option>
        <option value="Terreno">Terreno</option>
        <option value="Oficina">Oficina</option>
        <option value="Local comercial">Local comercial</option>
      </select>
    </div>
  </div>

  <!-- UBICACIÓN & PRECIO -->
  <div class="card">
    <div class="card-title">📍 Ubicación y precio</div>
    <div class="field">
      <label class="lbl" for="distrito">Distrito</label>
      <input class="inp" type="text" id="distrito" placeholder="Ej: Miraflores, San Isidro…" oninput="debouncedPreview()">
    </div>
    <div class="field">
      <label class="lbl" for="precio">Precio</label>
      <div class="price-row">
        <select class="currency" id="moneda" onchange="debouncedPreview()">
          <option value="$">$</option>
          <option value="S/">S/</option>
        </select>
        <input class="inp" type="text" id="precio" placeholder="180,000" oninput="debouncedPreview()">
      </div>
    </div>
  </div>

  <!-- DETALLES -->
  <div class="card">
    <div class="card-title">🔢 Detalles</div>
    <div class="stats-grid">
      <div class="stat-box"><label class="lbl" for="dorm">🛏 Dorm.</label><input class="stat-inp" type="number" id="dorm" value="3" min="0" max="20" oninput="debouncedPreview()"></div>
      <div class="stat-box"><label class="lbl" for="banos">🚿 Baños</label><input class="stat-inp" type="number" id="banos" value="2" min="0" max="20" oninput="debouncedPreview()"></div>
      <div class="stat-box"><label class="lbl" for="area">📐 m²</label><input class="stat-inp" type="number" id="area" value="120" min="0" oninput="debouncedPreview()"></div>
      <div class="stat-box"><label class="lbl" for="estac">🚗 Estac.</label><input class="stat-inp" type="number" id="estac" value="1" min="0" max="10" oninput="debouncedPreview()"></div>
    </div>
  </div>

  <!-- CARACTERÍSTICAS -->
  <div class="card">
    <div class="card-title">✨ Características</div>
    <div class="checks-grid">
      <div class="chk-item"><input type="checkbox" id="cEstac" onchange="debouncedPreview()"><label for="cEstac">🚗 Estacionamiento</label></div>
      <div class="chk-item"><input type="checkbox" id="cTerr"  onchange="debouncedPreview()"><label for="cTerr">🌿 Terraza</label></div>
      <div class="chk-item"><input type="checkbox" id="cPisc"  onchange="debouncedPreview()"><label for="cPisc">🏊 Piscina</label></div>
      <div class="chk-item"><input type="checkbox" id="cJard"  onchange="debouncedPreview()"><label for="cJard">🌳 Jardín</label></div>
      <div class="chk-item"><input type="checkbox" id="cGym"   onchange="debouncedPreview()"><label for="cGym">💪 Gimnasio</label></div>
      <div class="chk-item"><input type="checkbox" id="cSeg"   onchange="debouncedPreview()"><label for="cSeg">🔒 Seguridad 24h</label></div>
      <div class="chk-item"><input type="checkbox" id="cVista" onchange="debouncedPreview()"><label for="cVista">🌊 Vista al mar</label></div>
      <div class="chk-item"><input type="checkbox" id="cAmob"  onchange="debouncedPreview()"><label for="cAmob">🛋️ Amoblado</label></div>
      <div class="chk-item"><input type="checkbox" id="cVParq" onchange="debouncedPreview()"><label for="cVParq">🌳 Vista a parque</label></div>
      <div class="chk-item"><input type="checkbox" id="cSParq" onchange="debouncedPreview()"><label for="cSParq">🚪 Salida a parque</label></div>
    </div>
  </div>

  <!-- CONTACTO -->
  <div class="card">
    <div class="card-title">📱 Contacto</div>
    <div class="field">
      <label class="lbl" for="desc">Tagline / descripción (opcional)</label>
      <textarea class="inp" id="desc" placeholder="Ej: Perfecto para inversión · Vista al mar y parque" oninput="debouncedPreview()"></textarea>
    </div>
  </div>

  <button class="dl-btn" id="dlBtn" onclick="download()">⬇️ Descargar Story para Instagram</button>
</div>

<div class="toast" id="toast"></div>
<canvas id="mainCanvas"></canvas>

// ── Contact line with WhatsApp icon ───────────────────
function drawContactLine(ctx, cx, y, color, sz) {
  const phone = '964 109 277';
  const text  = phone;
  ctx.font = `300 ${sz}px ${FB}`;
  const tw = ctx.measureText(text).width;
  const iconSz = Math.round(sz * 1.3);
  const gap = Math.round(sz * 0.5);
  const totalW = iconSz + gap + tw;
  let x = cx - totalW / 2;
  if (waImg) ctx.drawImage(waImg, x, y - iconSz * 0.82, iconSz, iconSz);
  x += iconSz + gap;
  ctx.fillStyle = color; ctx.textAlign = 'left';
  ctx.fillText(text, x, y);
  ctx.textAlign = 'center';
}

function setMode(m) {

function updateModeHint() {
  const n = photoImgs.length;

    ? `Se generarán ${n} imágenes, una por foto`
    : (n>4 ? 'Se usarán las primeras 4 fotos en el collage' : `${n} fotos en una sola imagen`);
}

function updateDlBtn() {
  document.getElementById('dlBtn').textContent =

      ? `⬇️ Descargar ${photoImgs.length} Stories`
      : '⬇️ Descargar Story para Instagram';
}

// ── Photo handling ─────────────────────────────────────
function onPhoto(e) {
  const files = Array.from(e.target.files); if (!files.length) return;
  let loaded = 0;
  const newImgs = Array(files.length);
  files.forEach((file, idx) => {
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        newImgs[idx] = { img, src: ev.target.result };
        if (++loaded === files.length) {
          photoImgs = [...photoImgs, ...newImgs.map(x => x.img)];
          renderThumbs(newImgs.map(x => x.src));
          showPhotoControls(); drawPreview();
        }
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
  e.target.value = '';
}

function renderThumbs(newSrcs) {
  const strip = document.getElementById('thumbStrip');
  newSrcs.forEach((src, ai) => {
    const gi = photoImgs.length - newSrcs.length + ai;
    const wrap = document.createElement('div'); wrap.className='thumb-item'; wrap.dataset.idx=gi;
    const img = document.createElement('img'); img.src=src;
    if (gi===0) img.classList.add('active-thumb');
    img.onclick = () => { document.querySelectorAll('.thumb-item img').forEach(x=>x.classList.remove('active-thumb')); img.classList.add('active-thumb'); drawPreview(); };
    const btn = document.createElement('button'); btn.className='thumb-remove'; btn.textContent='×';
    btn.onclick = ev => { ev.stopPropagation(); removePhoto(gi); };
    wrap.appendChild(img); wrap.appendChild(btn); strip.appendChild(wrap);
  });
}

function removePhoto(idx) {
  photoImgs.splice(idx, 1);
  const strip = document.getElementById('thumbStrip'); strip.innerHTML='';
  photoImgs.forEach((imgObj, i) => {
    const c=document.createElement('canvas'); c.width=64; c.height=64;
    const cx=c.getContext('2d');
    const sc=Math.max(64/imgObj.width,64/imgObj.height);
    cx.drawImage(imgObj,(64-imgObj.width*sc)/2,(64-imgObj.height*sc)/2,imgObj.width*sc,imgObj.height*sc);
    const wrap=document.createElement('div'); wrap.className='thumb-item'; wrap.dataset.idx=i;
    const ie=document.createElement('img'); ie.src=c.toDataURL();
    if(i===0) ie.classList.add('active-thumb');
    ie.onclick=()=>{document.querySelectorAll('.thumb-item img').forEach(x=>x.classList.remove('active-thumb'));ie.classList.add('active-thumb');drawPreview();};
    const btn=document.createElement('button'); btn.className='thumb-remove'; btn.textContent='×';
    btn.onclick=ev=>{ev.stopPropagation();removePhoto(i);};
    wrap.appendChild(ie); wrap.appendChild(btn); strip.appendChild(wrap);
  });
  showPhotoControls(); drawPreview();
}

function showPhotoControls() {
  const n=photoImgs.length;
  document.getElementById('thumbStrip').style.display   = n ? 'flex':'none';
  document.getElementById('multiModeRow').style.display  = n>1 ? 'block':'none';
  if (n<=1 && multiMode==='collage') setMode('slides');
  if (n>1) updateModeHint();
  updateDlBtn();
}

function activePhotoIdx() {
  const a=document.querySelector('.thumb-item img.active-thumb');
  return a ? parseInt(a.closest('.thumb-item').dataset.idx)||0 : 0;
}

function getData() {
  const chk = id => document.getElementById(id).checked;
  const feats = [
    chk('cEstac')&&'Estacionamiento', chk('cTerr')&&'Terraza',
    chk('cPisc')&&'Piscina',          chk('cJard')&&'Jardín',
    chk('cGym')&&'Gimnasio',          chk('cSeg')&&'Seguridad 24h',
    chk('cVista')&&'Vista al mar',    chk('cAmob')&&'Amoblado',
    chk('cVParq')&&'Vista a parque',  chk('cSParq')&&'Salida a parque',
  ].filter(Boolean);
  const tipo = document.getElementById('tipoProp').value;
  const hideDets = tipo==='Terreno';
  const venta = document.getElementById('opVenta').checked;
  const alq   = document.getElementById('opAlq').checked;
  return {
    op: (venta&&alq) ? 'VENTA / ALQUILER' : alq ? 'ALQUILER' : 'VENTA',
    tipo, distrito: document.getElementById('distrito').value.trim()||'Lima',
    moneda: document.getElementById('moneda').value,
    precio: document.getElementById('precio').value.trim(),
    dorm:   hideDets?'':document.getElementById('dorm').value,
    banos:  hideDets?'':document.getElementById('banos').value,
    area:   document.getElementById('area').value,
    estac:  document.getElementById('estac').value,
    wp:     '964109277',
    desc:   document.getElementById('desc').value.trim(),
    feats,  photoPos: 0.5,
  };
}

// ── Canvas utils ───────────────────────────────────────
function rrect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();}

function wrapText(ctx,text,x,y,maxW,lh,maxL=99){
  if(!text)return 0;
  const words=text.split(' '); const lines=[]; let line='';
  for(const w of words){const t=line?line+' '+w:w;if(ctx.measureText(t).width>maxW&&line){lines.push(line);line=w;if(lines.length>=maxL)break;}else line=t;}
  if(line&&lines.length<maxL)lines.push(line);
  if(lines.length===maxL){let l=lines[maxL-1];while(ctx.measureText(l+'…').width>maxW&&l.length>1)l=l.slice(0,-1);lines[maxL-1]=l+'…';}
  lines.forEach((l,i)=>ctx.fillText(l,x,y+i*lh));
  return lines.length*lh;
}

function drawImgCover(ctx,img,x,y,w,h,pos=0.5){
  const sc=Math.max(w/img.width,h/img.height);
  const sw=img.width*sc,sh=img.height*sc;
  const ox=x+(w-sw)/2, oy=y-Math.max(0,sh-h)*pos;
  ctx.drawImage(img,ox,oy,sw,sh);
}

function placeholderBg(ctx,x,y,w,h){
  const g=ctx.createLinearGradient(x,y,x+w,y+h);
  g.addColorStop(0,'#1B2A4A');g.addColorStop(1,'#2D4470');
  ctx.fillStyle=g;ctx.fillRect(x,y,w,h);
  ctx.fillStyle='rgba(255,255,255,.06)';ctx.font=`700 130px ${FS}`;ctx.textAlign='center';
  ctx.fillText('FOTO',x+w/2,y+h/2+45);
}

// Operation word in verb form (matching reference image style)
function opWord(op){
  if(op==='VENTA / ALQUILER') return 'VENDO /\nALQUILO';
  return op==='VENTA'?'VENDO':'ALQUILO';
}
function opWordInline(op){
  if(op==='VENTA / ALQUILER') return 'VENDO / ALQUILO';
  return op==='VENTA'?'VENDO':'ALQUILO';
}

// Draw agency logo — uses uploaded image or elegant text fallback
function drawLogo(ctx,x,y,maxW,maxH,align='left',dark=false){
  const col    = dark ? '#1A1A1A' : WHITE;
  const subtle = dark ? '#666'    : 'rgba(255,255,255,.7)';
  if(logoImg){
    const sc=Math.min(maxW/logoImg.width,maxH/logoImg.height);
    const lw=logoImg.width*sc, lh=logoImg.height*sc;
    const lx=align==='right'?x-lw:align==='center'?x-lw/2:x;
    ctx.drawImage(logoImg,lx,y,lw,lh);
    return lh;
  }
  // Text fallback — mimics the VA monogram style
  const monSz = Math.min(maxH*0.58, 130);
  ctx.fillStyle=col; ctx.font=`700 ${monSz}px ${FS}`; ctx.textAlign=align;
  ctx.fillText('VA',x,y+monSz);
  const sub=Math.min(maxH*0.18,28);
  ctx.fillStyle=subtle; ctx.font=`300 ${sub}px ${FB}`;
  ctx.fillText('Vero Depas & Más',x,y+monSz+sub+10);
  return monSz+sub+16;
}

// Vertical stats list (Image 1 style — "3 DORMS", "2 BAÑOS", etc.)
function statsListV(ctx,d,x,y,col=WHITE,sz=40){
  const items=[];
  if(d.dorm  &&+d.dorm >0) items.push(`${d.dorm} DORM${+d.dorm>1?'S':''}`);
  if(d.banos &&+d.banos>0) items.push(`${d.banos} BAÑO${+d.banos>1?'S':''}`);
  if(d.area  &&+d.area >0) items.push(`${d.area} M2`);
  if(d.estac &&+d.estac>0) items.push(`${d.estac} COCHERA${+d.estac>1?'S':''}`);
  d.feats.slice(0,4).forEach(f=>items.push(f.toUpperCase()));
  ctx.fillStyle=col; ctx.font=`600 ${sz}px ${FB}`; ctx.textAlign='left';
  const lh=sz*1.55;
  items.forEach((it,i)=>ctx.fillText(it,x,y+i*lh+sz));
  return items.length*lh;
}

// Bordered stats box (Image 2 style)
function statsBox(ctx,d,x,y,w,dark=false){
  const items=[];
  if(d.dorm  &&+d.dorm >0) items.push({ico:'🛏',t:`${d.dorm} DORM${+d.dorm>1?'S':''}`});
  if(d.banos &&+d.banos>0) items.push({ico:'🚿',t:`${d.banos} BAÑO${+d.banos>1?'S':''}`});
  if(d.area  &&+d.area >0) items.push({ico:'📐',t:`${d.area} MTS`});
  if(d.estac &&+d.estac>0) items.push({ico:'🚗',t:`${d.estac} COCHERA${+d.estac>1?'S':''}`});
  d.feats.slice(0,4).forEach(f=>items.push({ico:'·',t:f.toUpperCase()}));
  if(!items.length)return 0;
  const col   =dark?WHITE:'#1A1A1A';
  const border=dark?'rgba(255,255,255,.5)':'#1A1A1A';
  const lh=58, ph=30, pv=26;
  const bh=items.length*lh+pv*2;
  ctx.strokeStyle=border; ctx.lineWidth=2.5; rrect(ctx,x,y,w,bh,18); ctx.stroke();
  ctx.fillStyle=col; ctx.font=`500 30px ${FB}`; ctx.textAlign='left';
  items.forEach((it,i)=>ctx.fillText(`${it.ico}  ${it.t}`,x+ph,y+pv+i*lh+34));
  return bh;
}

// Agency footer bar (navy/gold — our brand)
function agencyBar(ctx,d,y,h){
  ctx.fillStyle='rgba(27,42,74,.93)'; ctx.fillRect(0,y,CW,h);
  ctx.fillStyle=GOLD; ctx.fillRect(0,y,CW,5);
  ctx.textAlign='center';
  ctx.fillStyle=WHITE; ctx.font=`700 40px ${FB}`; ctx.fillText('ORIETTA SOTOMAYOR',CW/2,y+62);
  ctx.fillStyle=GOLD;  ctx.font=`500 26px ${FB}`; ctx.fillText('REALTOR  ·  LIMA, PERÚ',CW/2,y+102);
  ctx.fillStyle='rgba(255,255,255,.7)'; ctx.font=`400 28px ${FB}`;
  drawContactLine(ctx, CW/2, y+148, 'rgba(255,255,255,.7)', 28);
}

// ──────────────────────────────────────────────────────
//  TEMPLATE 1 — CLÁSICO
//  Full photo · dark bottom overlay · VENDO large ·
//  stats list right · logo bottom-right
//  (inspired by Image 1 reference)
// ──────────────────────────────────────────────────────
function renderClasico(ctx,d,photo){
  if(photo) drawImgCover(ctx,photo,0,0,CW,CH,d.photoPos);
  else placeholderBg(ctx,0,0,CW,CH);

  // Dark gradient covering bottom ~40%
  const darkY = Math.round(CH*0.60); // y=1152
  const g=ctx.createLinearGradient(0,darkY-150,0,CH);
  g.addColorStop(0,'rgba(0,0,0,0)');
  g.addColorStop(0.22,'rgba(0,0,0,0.65)');
  g.addColorStop(1,'rgba(0,0,0,0.90)');
  ctx.fillStyle=g; ctx.fillRect(0,darkY-150,CW,CH-darkY+150);

  // Thin separator line
  ctx.strokeStyle='rgba(255,255,255,.28)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(70,darkY); ctx.lineTo(CW-70,darkY); ctx.stroke();

  // LEFT COLUMN: operation word + description + district
  const word = opWordInline(d.op);
  let wordFS = 155;
  ctx.font = `700 ${wordFS}px ${FS}`;
  while (wordFS > 55 && ctx.measureText(word).width > 440) { wordFS -= 3; ctx.font = `700 ${wordFS}px ${FS}`; }
  ctx.fillStyle=WHITE; ctx.textAlign='left';
  ctx.fillText(word,70,darkY+wordFS+20);

  if(d.desc){
    ctx.fillStyle='rgba(255,255,255,.78)'; ctx.font=`400 36px ${FB}`; ctx.textAlign='left';
    wrapText(ctx,d.desc,70,darkY+wordFS+70,460,52,2);
  }

  // District + tipo near bottom-left
  ctx.fillStyle='rgba(255,255,255,.60)'; ctx.font=`600 36px ${FB}`;
  ctx.fillText(d.distrito.toUpperCase(),70,CH-220);
  ctx.fillStyle='rgba(255,255,255,.40)'; ctx.font=`400 28px ${FB}`;
  ctx.fillText(d.tipo,70,CH-176);

  // Vertical divider
  ctx.strokeStyle='rgba(255,255,255,.20)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(555,darkY+20); ctx.lineTo(555,CH-155); ctx.stroke();

  // RIGHT COLUMN: stats
  statsListV(ctx,d,585,darkY+20,WHITE,40);

  // Logo bottom-right
  drawLogo(ctx,CW-70,CH-240,360,170,'right',false);

  // Name + Contact
  ctx.fillStyle='rgba(255,255,255,.70)'; ctx.font=`600 30px ${FB}`; ctx.textAlign='center';
  ctx.fillText('ORIETTA SOTOMAYOR · REALTOR', CW/2, CH-82);
  drawContactLine(ctx, CW/2, CH-38, 'rgba(255,255,255,.45)', 26);
}

// ──────────────────────────────────────────────────────
//  TEMPLATE 2 — EDITORIAL
//  Photo top · cream panel · logo left · stats box right
//  (inspired by Image 2 reference)
// ──────────────────────────────────────────────────────
function renderEditorial(ctx,d,photo){
  const splitY = Math.round(CH*0.53); // ~1018px

  // Photo section
  ctx.save(); ctx.beginPath(); ctx.rect(0,0,CW,splitY); ctx.clip();
  if(photo) drawImgCover(ctx,photo,0,0,CW,splitY,d.photoPos);
  else placeholderBg(ctx,0,0,CW,splitY);
  ctx.restore();

  // Operation word overlay on photo (top-left, bold + shadow)
  const word = opWordInline(d.op);
  const wordFS = word.length>14?88:word.length>7?110:140;
  ctx.shadowColor='rgba(0,0,0,0.55)'; ctx.shadowBlur=24;
  ctx.fillStyle=WHITE; ctx.font=`700 ${wordFS}px ${FS}`; ctx.textAlign='left';
  ctx.fillText(word,70,wordFS+50);
  ctx.fillStyle='rgba(255,255,255,.88)'; ctx.font=`700 58px ${FB}`;
  ctx.fillText(d.distrito.toUpperCase(),70,wordFS+120);
  ctx.shadowBlur=0;

  // Fade photo→panel
  const fade=ctx.createLinearGradient(0,splitY-100,0,splitY+40);
  fade.addColorStop(0,`rgba(242,232,217,0)`); fade.addColorStop(1,`rgba(242,232,217,1)`);
  ctx.fillStyle=fade; ctx.fillRect(0,splitY-100,CW,140);

  // Cream panel
  ctx.fillStyle=CREAM_PANEL; ctx.fillRect(0,splitY,CW,CH-splitY);

  const pad=60, colW=(CW-pad*3)/2; // ~420px per column
  const c1=pad, c2=pad*2+colW;     // x=60, x=540
  let ly=splitY+46, ry=splitY+46;

  // Logo — left column
  const lh=drawLogo(ctx,c1,ly,colW,210,'left',true);
  ly+=lh+28;

  // Stats box — right column
  const sbh=statsBox(ctx,d,c2,ry,colW,false);
  ry+=sbh+24;

  // Price — left
  if(d.precio){
    const ps=`${d.moneda} ${d.precio}`;
    ctx.fillStyle='#1A1A1A'; let fs=80; ctx.font=`700 ${fs}px ${FS}`;
    while(ctx.measureText(ps).width>colW&&fs>48){fs-=4;ctx.font=`700 ${fs}px ${FS}`;}
    ctx.textAlign='left'; ctx.fillText(ps,c1,ly+fs); ly+=fs+22;
  }

  // Description box — spans width or left col
  if(d.desc){
    ctx.font=`500 30px ${FB}`; ctx.textAlign='left';
    const lines=Math.min(3,Math.ceil(d.desc.length/38));
    const dbh=lines*44+52;
    ctx.strokeStyle='#1A1A1A'; ctx.lineWidth=2.5;
    rrect(ctx,c1,ly,colW,dbh,16); ctx.stroke();
    ctx.fillStyle='#1A1A1A';
    wrapText(ctx,d.desc,c1+24,ly+42,colW-48,44,3);
    ly+=dbh+16;
  }

  // Tipo — small label
  ctx.fillStyle='#888'; ctx.font=`400 28px ${FB}`; ctx.textAlign='left';
  ctx.fillText(d.tipo,c1,Math.max(ly+28, ry+28));

  // Agency bar
  agencyBar(ctx,d,CH-175,175);
}

// ──────────────────────────────────────────────────────
//  TEMPLATE 3 — IMPACTO
//  Full-bleed · strong bottom gradient · big price · logo
// ──────────────────────────────────────────────────────
function renderImpacto(ctx,d,photo){
  if(photo) drawImgCover(ctx,photo,0,0,CW,CH,d.photoPos);
  else placeholderBg(ctx,0,0,CW,CH);

  const g=ctx.createLinearGradient(0,CH*0.30,0,CH);
  g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(0.35,'rgba(0,0,0,.52)'); g.addColorStop(1,'rgba(0,0,0,.94)');
  ctx.fillStyle=g; ctx.fillRect(0,0,CW,CH);

  // Top bar
  const accent=d.op==='ALQUILER'?'#28A86E':GOLD;
  ctx.fillStyle=accent; ctx.fillRect(0,0,CW,12);

  // Logo top-right
  drawLogo(ctx,CW-70,50,280,140,'right',false);

  let y=CH-230;
  ctx.fillStyle='rgba(255,255,255,.82)'; ctx.font=`600 32px ${FB}`; ctx.textAlign='left';
  ctx.fillText('ORIETTA SOTOMAYOR · REALTOR',70,y); y-=48;
  ctx.fillStyle=GOLD; ctx.font=`400 26px ${FB}`;
  drawContactLine(ctx, CW/2, y, GOLD, 26); y-=60;

  if(d.feats.length){ctx.fillStyle='rgba(255,255,255,.78)';ctx.font=`400 28px ${FB}`;ctx.textAlign='left';ctx.fillText(d.feats.slice(0,4).join('  ·  '),70,y);y-=56;}
  if(d.desc){ctx.fillStyle='rgba(255,255,255,.65)';ctx.font=`300 italic 30px ${FB}`;ctx.textAlign='left';y-=50;wrapText(ctx,`"${d.desc}"`,70,y,CW-140,44,2);y-=20;}

  if(d.precio){
    y-=20; const ps=`${d.moneda} ${d.precio}`;
    ctx.fillStyle=GOLD; let fs=128; ctx.font=`700 ${fs}px ${FS}`;
    while(ctx.measureText(ps).width>CW-140&&fs>70){fs-=5;ctx.font=`700 ${fs}px ${FS}`;}
    ctx.textAlign='left'; ctx.fillText(ps,70,y); y-=fs+20;
  }

  const si=[];
  if(d.dorm &&+d.dorm >0)si.push(`🛏 ${d.dorm}`);
  if(d.banos&&+d.banos>0)si.push(`🚿 ${d.banos}`);
  if(d.area &&+d.area >0)si.push(`${d.area} m²`);
  if(d.estac&&+d.estac>0)si.push(`🚗 ${d.estac}`);
  if(si.length){ctx.fillStyle='rgba(255,255,255,.78)';ctx.font=`400 38px ${FB}`;ctx.textAlign='left';ctx.fillText(si.join('   '),70,y);y-=66;}

  ctx.fillStyle=GOLD; ctx.fillRect(70,y,90,5); y-=44;
  ctx.fillStyle=WHITE; ctx.font=`700 88px ${FS}`; ctx.textAlign='left';
  y-=wrapText(ctx,d.distrito,70,y-80,CW-140,100,2)+40;
  ctx.fillStyle='rgba(255,255,255,.62)'; ctx.font=`300 36px ${FB}`;
  ctx.fillText(d.tipo.toUpperCase(),70,y);
}

// ──────────────────────────────────────────────────────
//  COLLAGE
// ──────────────────────────────────────────────────────
function renderCollage(ctx,d){
  const photos=photoImgs.slice(0,4), n=photos.length;
  const photoH=Math.round(CH*0.56), infoY=photoH;

  if(n===0) placeholderBg(ctx,0,0,CW,photoH);
  else if(n===1){ctx.save();ctx.beginPath();ctx.rect(0,0,CW,photoH);ctx.clip();drawImgCover(ctx,photos[0],0,0,CW,photoH,d.photoPos);ctx.restore();}
  else if(n===2){
    const hw=(CW-GAP)/2;
    [[0,photos[0]],[hw+GAP,photos[1]]].forEach(([x,img])=>{ctx.save();ctx.beginPath();ctx.rect(x,0,hw,photoH);ctx.clip();drawImgCover(ctx,img,x,0,hw,photoH,d.photoPos);ctx.restore();});
    ctx.fillStyle=CREAM_PANEL; ctx.fillRect(hw,0,GAP,photoH);
  } else if(n===3){
    const hw=(CW-GAP)/2,hh=(photoH-GAP)/2;
    ctx.save();ctx.beginPath();ctx.rect(0,0,hw,photoH);ctx.clip();drawImgCover(ctx,photos[0],0,0,hw,photoH,d.photoPos);ctx.restore();
    [[0,photos[1]],[hh+GAP,photos[2]]].forEach(([y,img])=>{ctx.save();ctx.beginPath();ctx.rect(hw+GAP,y,hw,hh);ctx.clip();drawImgCover(ctx,img,hw+GAP,y,hw,hh,d.photoPos);ctx.restore();});
    ctx.fillStyle=CREAM_PANEL; ctx.fillRect(hw,0,GAP,photoH); ctx.fillRect(hw+GAP,hh,hw,GAP);
  } else {
    const hw=(CW-GAP)/2,hh=(photoH-GAP)/2;
    photos.forEach((img,i)=>{const col=i%2,row=Math.floor(i/2),x=col*(hw+GAP),y=row*(hh+GAP);ctx.save();ctx.beginPath();ctx.rect(x,y,hw,hh);ctx.clip();drawImgCover(ctx,img,x,y,hw,hh,d.photoPos);ctx.restore();});
    ctx.fillStyle=CREAM_PANEL; ctx.fillRect(hw,0,GAP,photoH); ctx.fillRect(0,photoH/2-GAP/2,CW,GAP);
  }

  // Dark overlay on photo portion
  const pv=ctx.createLinearGradient(0,0,0,photoH);
  pv.addColorStop(0,'rgba(0,0,0,.28)'); pv.addColorStop(0.7,'rgba(0,0,0,.08)'); pv.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=pv; ctx.fillRect(0,0,CW,photoH);

  // Photo→panel fade
  const fade=ctx.createLinearGradient(0,photoH-100,0,infoY+40);
  fade.addColorStop(0,`rgba(242,232,217,0)`); fade.addColorStop(1,`rgba(242,232,217,1)`);
  ctx.fillStyle=fade; ctx.fillRect(0,photoH-100,CW,140);

  ctx.fillStyle=CREAM_PANEL; ctx.fillRect(0,infoY,CW,CH-infoY);

  // Op badge on photo
  const opB=d.op==='VENTA/ALQUILER'?'VENTA / ALQUILER':d.op==='VENTA'?'EN VENTA':'EN ALQUILER';
  const bgC=d.op==='ALQUILER'?'#2A7A50':GOLD; const txC=d.op==='ALQUILER'?WHITE:NAVY;
  ctx.font=`700 34px ${FB}`; const bw=ctx.measureText(opB).width+72;
  ctx.fillStyle=bgC; rrect(ctx,60,60,bw,76,38); ctx.fill();
  ctx.fillStyle=txC; ctx.textAlign='left'; ctx.fillText(opB,96,112);

  const pad=60,colW=(CW-pad*3)/2, c1=pad, c2=pad*2+colW;
  let ly=infoY+46, ry=infoY+46;

  const lh=drawLogo(ctx,c1,ly,colW,200,'left',true); ly+=lh+24;
  const sbh=statsBox(ctx,d,c2,ry,colW,false); ry+=sbh+20;

  if(d.precio){
    const ps=`${d.moneda} ${d.precio}`;
    ctx.fillStyle='#1A1A1A'; let fs=76; ctx.font=`700 ${fs}px ${FS}`;
    while(ctx.measureText(ps).width>colW&&fs>44){fs-=4;ctx.font=`700 ${fs}px ${FS}`;}
    ctx.textAlign='left'; ctx.fillText(ps,c1,ly+fs); ly+=fs+20;
  }

  if(d.desc){
    ctx.font=`500 28px ${FB}`; const lines=Math.min(3,Math.ceil(d.desc.length/36));
    const dbh=lines*42+48;
    ctx.strokeStyle='#1A1A1A'; ctx.lineWidth=2.5; rrect(ctx,c1,ly,colW,dbh,14); ctx.stroke();
    ctx.fillStyle='#1A1A1A'; wrapText(ctx,d.desc,c1+22,ly+38,colW-44,42,3);
  }

  agencyBar(ctx,d,CH-175,175);
}

// ── Main render ────────────────────────────────────────
function renderTo(canvas,photo){
  canvas.width=CW; canvas.height=CH;
  const ctx=canvas.getContext('2d'); ctx.clearRect(0,0,CW,CH);
  const d=getData();
  if(multiMode==='collage'&&photoImgs.length>1){renderCollage(ctx,d);return;}
  const img=photo||(photoImgs.length?photoImgs[0]:null);
  if(tpl===1) renderClasico(ctx,d,img);
  else if(tpl===2) renderEditorial(ctx,d,img);
  else renderImpacto(ctx,d,img);
}

// ── Preview ────────────────────────────────────────────
let _t=null;
function debouncedPreview(){clearTimeout(_t);_t=setTimeout(drawPreview,120);}
function drawPreview(){
  const mc=document.getElementById('mainCanvas');
  const pp=(multiMode==='slides'&&photoImgs.length>1)?photoImgs[activePhotoIdx()]:(photoImgs.length?photoImgs[0]:null);
  renderTo(mc,pp);
  const pv=document.getElementById('previewCanvas');
  pv.width=CW; pv.height=CH;
  pv.getContext('2d').drawImage(mc,0,0);
}

// ── Download ───────────────────────────────────────────
async function download(){
  const d=getData(), mc=document.getElementById('mainCanvas');
  const base=`story-${d.distrito.replace(/\s+/g,'-').toLowerCase()}`;

  if(multiMode==='slides'&&photoImgs.length>1){
    toast(`⏳ Generando ${photoImgs.length} stories…`);
    const files=await Promise.all(photoImgs.map((img,i)=>new Promise(res=>{
      renderTo(mc,img);
      mc.toBlob(b=>res(new File([b],`${base}-${i+1}.jpg`,{type:'image/jpeg'})),'image/jpeg',.94);
    })));
    if(navigator.canShare&&navigator.canShare({files})){
      try{await navigator.share({files,title:'Stories listas para Instagram'});return;}
      catch(e){if(e.name==='AbortError')return;}
    }
    files.forEach((f,i)=>setTimeout(()=>{const l=document.createElement('a');l.download=f.name;l.href=URL.createObjectURL(f);l.click();setTimeout(()=>URL.revokeObjectURL(l.href),10000);},i*400));
    toast(`✅ ${photoImgs.length} stories descargadas`);
  } else {
    renderTo(mc,photoImgs[0]||null);
    mc.toBlob(async b=>{
      const fname=`${base}.jpg`, file=new File([b],fname,{type:'image/jpeg'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        try{await navigator.share({files:[file],title:'Story lista para Instagram'});return;}
        catch(e){if(e.name==='AbortError')return;}
      }
      const l=document.createElement('a');l.download=fname;l.href=URL.createObjectURL(b);l.click();
      setTimeout(()=>URL.revokeObjectURL(l.href),10000);
      toast('✅ Story descargada — ¡lista para Instagram!');
    },'image/jpeg',.94);
  }
}

// ── Toast ──────────────────────────────────────────────
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),3200);
}

drawPreview();
